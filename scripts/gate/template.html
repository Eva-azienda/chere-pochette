            .staticrypt-form { background: #fff; border: 1px solid rgba(41,41,41,.12); border-radius: 16px; padding: 32px 24px 28px; box-shadow: 0 1px 2px rgba(84,21,44,.06), 0 8px 24px rgba(84,21,44,.08); text-align: center; }

            .staticrypt-password-container { position: relative; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                box-sizing: border-box; width: 100%; min-height: 48px; padding: 12px 48px 12px 14px;
                border: 1px solid rgba(41,41,41,.28); border-radius: 10px; background: #fff;
                font: inherit; font-size: 16px; color: #292929; outline: none;
            }
            .staticrypt-form input:focus { border-color: #82001f; box-shadow: 0 0 0 3px rgba(130,0,31,.15); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; opacity: .55; cursor: pointer; }
            label.staticrypt-remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 4px; font-size: 14px; color: #6d6460; cursor: pointer; }
            .staticrypt-remember input[type="checkbox"] { width: 18px; height: 18px; accent-color: #82001f; margin: 0; }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 999px;
                background: /*[|template_color_primary|]*/ 0; color: #fff; font: inherit; font-size: 16px; font-weight: 600; letter-spacing: .02em; cursor: pointer;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover, .staticrypt-form .staticrypt-decrypt-button:focus-visible { background: #761f26; }
            .gate-footer { margin-top: 16px; text-align: center; font-size: 12px; color: #6d6460; letter-spacing: .14em; text-transform: uppercase; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { display: inline-block; width: 2rem; height: 2rem; vertical-align: text-bottom; border: .2em solid #82001f; border-right-color: transparent; border-radius: 50%; animation: spinner-border .75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 2s; } }

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
